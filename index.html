<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam Analyzer & Bulk Data Portal | SmartSoft</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --secondary: #475569;
      --border: #cbd5e1;
      --danger-bg: #fef2f2;
      --danger-text: #b91c1c;
      --success-bg: #f0fdf4;
      --success-text: #15803d;
      --warn-bg: #fffbeb;
      --warn-text: #b45309;
      --accent-soft: rgba(29, 78, 216, 0.08);
    }
    body.dark {
      --bg: #0b1120;
      --card: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --secondary: #334155;
      --border: #273549;
      --danger-bg: #450a0a;
      --danger-text: #fca5a5;
      --success-bg: #052e16;
      --success-text: #86efac;
      --warn-bg: #451a03;
      --warn-text: #fcd34d;
      --accent-soft: rgba(59, 130, 246, 0.14);
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Sinhala", "Noto Sans Tamil", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .page-wrap {
      padding: 14px;
      width: 100%;
    }
    .card {
      max-width: 1020px;
      width: 100%;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .title-group h1 {
      margin: 0;
      font-size: clamp(1.15rem, 2.5vw, 1.55rem);
    }
    .title-group p {
      margin: 3px 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .controls-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .lang-group {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg);
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: var(--text);
      padding: 7px 11px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }
    .lang-btn.active {
      background: var(--primary);
      color: #fff;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 9px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .tab-panel {
      display: none;
    }
    .tab-panel.active {
      display: block;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .span-full {
      grid-column: 1 / -1;
    }
    label {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 5px;
    }
    input, select, textarea {
      width: 100%;
      max-width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.94rem;
    }
    textarea {
      min-height: 160px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.84rem;
      resize: vertical;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 12px;
    }
    .btn {
      padding: 10px 15px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-secondary {
      background: var(--secondary);
      color: #fff;
    }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .check-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      margin-top: 6px;
    }
    .check-row input {
      width: auto;
      margin: 0;
    }
    .alert {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .alert.error {
      display: block;
      background: var(--danger-bg);
      color: var(--danger-text);
    }
    .alert.success {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
    }
    .alert.warn {
      display: block;
      background: var(--warn-bg);
      color: var(--warn-text);
    }
    .table-wrap {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      display: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      padding: 9px 11px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: var(--accent-soft);
      font-weight: 700;
    }
    tr.dup-row {
      background: rgba(220, 38, 38, 0.12);
    }
    .badge-new {
      background: #16a34a;
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }
    .badge-dup {
      background: #dc2626;
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }
    .footer {
      margin-top: 22px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.84rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="card">
      <div class="header">
        <div class="title-group">
          <h1 id="appTitle">Mo/Dutugemunu M.M.V.</h1>
          <p id="appSubtitle">Exam Results & Bulk Data Portal (Students, Teachers, Classes)</p>
        </div>
        <div class="controls-bar">
          <div class="lang-group" role="group" aria-label="Language Selector">
            <button type="button" class="lang-btn active" data-lang="si" onclick="setLanguage('si')">සිංහල</button>
            <button type="button" class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
            <button type="button" class="lang-btn" data-lang="ta" onclick="setLanguage('ta')">தமிழ்</button>
          </div>
          <button type="button" class="btn btn-outline" onclick="toggleTheme()" id="themeBtn">🌓 Theme</button>
        </div>
      </div>

      <!-- Common Google Sheet ID -->
      <div class="grid">
        <div class="span-full">
          <label for="sheetIdInput" id="lblSheetId">පාසලේ Google Sheet ID (හෝ සම්පූර්ණ Sheet URL)</label>
          <input id="sheetIdInput" type="text" placeholder="1YX_JorObWYSpXjmxV0azg-F9uBpql-Uvkhu2-Gf8phE" />
        </div>
      </div>

      <!-- Main Tabs -->
      <div class="tabs">
        <button type="button" class="tab-btn active" id="tabSearchBtn" onclick="switchTab('searchPanel', this)">🔍 ප්‍රතිඵල සෙවීම</button>
        <button type="button" class="tab-btn" id="tabBulkBtn" onclick="switchTab('bulkPanel', this)">📥 Bulk Data ඇතුළත් කිරීම</button>
      </div>

      <!-- Panel 1: Search / Read via GViz -->
      <section id="searchPanel" class="tab-panel active">
        <div class="grid">
          <div>
            <label for="sheetTabInput" id="lblTabName">Sheet Tab නම (විකල්ප / Optional)</label>
            <input id="sheetTabInput" type="text" placeholder="උදා: පළමු වාරය හෝ Sheet1" />
          </div>
          <div>
            <label for="admNoInput" id="lblAdmNo">ඇතුළත්වීමේ අංකය</label>
            <input id="admNoInput" type="text" placeholder="18501" />
          </div>
          <div>
            <label for="dobInput" id="lblDob">උපන් දිනය</label>
            <input id="dobInput" type="date" />
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn btn-primary" id="btnSearch" onclick="handleSearch()">ප්‍රතිඵල සොයන්න</button>
          <button type="button" class="btn btn-secondary" id="btnReset" onclick="handleReset()">ආපසු</button>
          <button type="button" class="btn btn-outline" id="btnExportSearchCsv" onclick="exportTableCsv(lastSearchRows, 'search_results.csv')">⬇ CSV Download</button>
        </div>

        <div id="searchAlert" class="alert"></div>
        <div id="searchTableWrap" class="table-wrap"></div>
      </section>

      <!-- Panel 2: Bulk Import (Students, Teachers, Classes) -->
      <section id="bulkPanel" class="tab-panel">
        <div class="grid">
          <div>
            <label for="categorySelect" id="lblCategory">දත්ත වර්ගය</label>
            <select id="categorySelect" onchange="handleCategoryChange()">
              <option value="students" id="optStudents">ශිෂ්‍ය තොරතුරු (Students)</option>
              <option value="teachers" id="optTeachers">ගුරු තොරතුරු (Teachers)</option>
              <option value="classes" id="optClasses">පන්ති තොරතුරු (Classes)</option>
            </select>
          </div>
          <div>
            <label for="scriptUrlInput" id="lblScriptUrl">Google Apps Script Web App URL</label>
            <input id="scriptUrlInput" type="url" placeholder="https://script.google.com/macros/s/AKfycb.../exec" />
          </div>
          <div>
            <label for="csvFileInput" id="lblCsvFile">CSV ගොනුවක් Upload කරන්න (.csv)</label>
            <input id="csvFileInput" type="file" accept=".csv,text/csv" onchange="handleCsvFile(event)" />
          </div>
        </div>

        <div class="grid">
          <div class="span-full">
            <label for="bulkTextarea" id="lblBulkData">Bulk දත්ත (CSV හෝ Excel/Sheets Copy-Paste — පළමු පේළිය Headers)</label>
            <textarea id="bulkTextarea"></textarea>
            <label class="check-row">
              <input type="checkbox" id="skipDupCheckbox" checked />
              <span id="lblSkipDup">Duplicate IDs skip කරන්න (දැනටමත් ඇති වාර්තා නැවත නොයවන්න)</span>
            </label>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn btn-outline" id="btnSample" onclick="loadSampleData()">ආදර්ශ දත්ත</button>
          <button type="button" class="btn btn-secondary" id="btnCheckDup" onclick="handlePreviewAndCheck()">🔍 Duplicate Check & Preview</button>
          <button type="button" class="btn btn-primary" id="btnSubmitBulk" onclick="handleBulkSubmit()">📤 Google Sheet වෙත යවන්න</button>
          <button type="button" class="btn btn-outline" id="btnExportBulkCsv" onclick="exportTableCsv(lastBulkRows, 'bulk_preview.csv')">⬇ CSV Download</button>
        </div>

        <div id="bulkAlert" class="alert"></div>
        <div id="bulkTableWrap" class="table-wrap"></div>
      </section>

      <div class="footer">© 2026 | Kelum Konara | SmartSoft</div>
    </div>
  </div>

    const CATEGORY_CONFIG = {
      students: { tab: "Students", keys: ["admission_no", "admissionno", "adm_no", "id"] },
      teachers: { tab: "Teachers", keys: ["nic", "teacher_id", "id", "email"] },
      classes:  { tab: "Classes",  keys: ["class_id", "classid", "class_name", "class"] }
    };

    const SAMPLES = {
      students: [
        "Admission_No,Full_Name,Grade_Class,DOB,Guardian_Phone",
        "18501,Kasun Perera,10-A,2015-09-17,0711234567",
        "18502,Nethmi Silva,10-A,2015-11-04,0777654321"
      ].join("\n"),
      teachers: [
        "NIC,Full_Name,Subject,Appointment_Date,Phone",
        "821234567V,A. B. Rathnayake,ICT,2006-06-28,0714469232",
        "856543210V,D. M. Jayawardena,Mathematics,2012-03-15,0701122334"
      ].join("\n"),
      classes: [
        "Class_ID,Grade,Section,Medium,Class_Teacher",
        "10-A,10,A,Sinhala,A. B. Rathnayake",
        "10-B,10,B,English,D. M. Jayawardena"
      ].join("\n")
    };

    let currentLang = "si";
    let lastSearchRows = [];
    let lastBulkRows = [];

    function t(key) {
      return (I18N[currentLang] && I18N[currentLang][key]) || I18N.si[key] || key;
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
      const dict = I18N[lang] || I18N.si;
      Object.keys(dict).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = dict[id];
      });
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
      localStorage.setItem("smartsoft_theme", document.body.classList.contains("dark") ? "dark" : "light");
    }

    function switchTab(panelId, btnEl) {
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById(panelId).classList.add("active");
      if (btnEl) btnEl.classList.add("active");
    }

    function showAlert(id, type, msg) {
      const el = document.getElementById(id);
      el.className = `alert ${type}`;
      el.textContent = msg;
    }

    function hideAlert(id) {
      const el = document.getElementById(id);
      el.className = "alert";
      el.textContent = "";
    }

    // Clean Sheet ID from URL query (?sheet=), full URL, or messy pasted text
    function cleanSheetId(raw) {
      if (!raw) return "";
      const str = String(raw)
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .replace(/^[<\s"'=]+|[>\s"']+$/g, "")
        .trim();

      const fullUrlMatch = str.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (fullUrlMatch) return fullUrlMatch[1];

      const idMatch = str.match(/([a-zA-Z0-9-_]{20,})/);
      return idMatch ? idMatch[1] : str;
    }

    window.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("smartsoft_theme") === "dark") {
        document.body.classList.add("dark");
      }

      const params = new URLSearchParams(window.location.search);
      const querySheet = params.get("sheet");
      const savedSheet = localStorage.getItem("smartsoft_sheet_id") || "";
      const savedScript = localStorage.getItem("smartsoft_script_url") || "";

      const resolvedId = cleanSheetId(querySheet || savedSheet);
      if (resolvedId) {
        document.getElementById("sheetIdInput").value = resolvedId;
        localStorage.setItem("smartsoft_sheet_id", resolvedId);
      }
      if (savedScript) {
        document.getElementById("scriptUrlInput").value = savedScript;
      }

      loadSampleData();
    });

    // Fetch via Google Sheets GViz endpoint
    async function fetchGvizRows(sheetId, tabName = "") {
      const id = cleanSheetId(sheetId);
      document.getElementById("sheetIdInput").value = id;
      if (!id) throw new Error(t("errMissingSheet"));

      localStorage.setItem("smartsoft_sheet_id", id);

      let url = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(id)}/gviz/tq?tqx=out:json`;
      if (tabName && tabName.trim()) {
        url += `&sheet=${encodeURIComponent(tabName.trim())}`;
      }

      const res = await fetch(url);
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}: ${t("errAccess")}`);
      }

      const text = await res.text();
      if (text.includes("<!DOCTYPE html>") || !text.includes("google.visualization.Query.setResponse")) {
        throw new Error(t("errAccess"));
      }

      const jsonStr = text
        .replace(/^\/\*O_o\*\/\s*google\.visualization\.Query\.setResponse\(/, "")
        .replace(/\);\s*$/, "");

      const parsed = JSON.parse(jsonStr);
      if (parsed.status === "error") {
        const msg = parsed.errors?.[0]?.detailed_message || parsed.errors?.[0]?.message || t("errAccess");
        throw new Error(msg);
      }

      const headers = parsed.table.cols.map((col, idx) => (col.label || `Column_${idx + 1}`).trim());
      return parsed.table.rows.map(row => {
        const obj = {};
        (row.c || []).forEach((cell, idx) => {
          obj[headers[idx]] = cell ? (cell.f ?? cell.v ?? "") : "";
        });
        return obj;
      });
    }

    function normalizeDate(val) {
      if (!val) return "";
      const gvizMatch = String(val).match(/^Date\((\d+),(\d+),(\d+)\)$/);
      if (gvizMatch) {
        const y = gvizMatch[1];
        const m = String(Number(gvizMatch[2]) + 1).padStart(2, "0");
        const d = String(gvizMatch[3]).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }
      const dt = new Date(val);
      if (!Number.isNaN(dt.getTime())) {
        const y = dt.getFullYear();
        const m = String(dt.getMonth() + 1).padStart(2, "0");
        const d = String(dt.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }
      return String(val).trim();
    }

    async function handleSearch() {
      hideAlert("searchAlert");
      const sheetId = document.getElementById("sheetIdInput").value;
      const tabName = document.getElementById("sheetTabInput").value;
      const admNo = document.getElementById("admNoInput").value.trim();
      const dobNorm = normalizeDate(document.getElementById("dobInput").value);

      try {
        const rows = await fetchGvizRows(sheetId, tabName);
        const filtered = rows.filter(row => {
          const vals = Object.values(row).map(v => String(v).trim());
          const okAdm = !admNo || vals.some(v => v === admNo);
          const okDob = !dobNorm || Object.values(row).some(v => normalizeDate(v) === dobNorm);
          return okAdm && okDob;
        });

        lastSearchRows = filtered.length ? filtered : rows.slice(0, 15);
        renderTable("searchTableWrap", lastSearchRows, false);
        showAlert("searchAlert", "success", `Matches: ${filtered.length} / Total rows: ${rows.length}`);
      } catch (err) {
        lastSearchRows = [];
        renderTable("searchTableWrap", [], false);
        showAlert("searchAlert", "error", err.message);
      }
    }

    function handleReset() {
      document.getElementById("admNoInput").value = "";
      document.getElementById("dobInput").value = "";
      lastSearchRows = [];
      hideAlert("searchAlert");
      renderTable("searchTableWrap", [], false);
    }

    function handleCategoryChange() {
      loadSampleData();
      lastBulkRows = [];
      hideAlert("bulkAlert");
      renderTable("bulkTableWrap", [], false);
    }

    function loadSampleData() {
      const cat = document.getElementById("categorySelect").value;
      document.getElementById("bulkTextarea").value = SAMPLES[cat] || "";
    }

    function handleCsvFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById("bulkTextarea").value = String(e.target?.result || "");
        hideAlert("bulkAlert");
        showAlert("bulkAlert", "success", `Loaded CSV: ${file.name}`);
      };
      reader.readAsText(file, "UTF-8");
    }

    function parseBulkRows(rawText) {
      const lines = String(rawText || "")
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(Boolean);

      if (lines.length < 2) {
        throw new Error(t("errMinRows"));
      }

      const delim = lines[0].includes("\t") ? "\t" : ",";
      const splitCols = (line) =>
        line
          .split(new RegExp(`${delim}(?=(?:[^"]*"[^"]*")*[^"]*$)`))
          .map(c => c.replace(/^"|"$/g, "").trim());

      const headers = splitCols(lines[0]);
      if (!headers.length || headers.some(h => !h)) {
        throw new Error(t("errMinRows"));
      }

      return lines.slice(1).map((line, idx) => {
        const cols = splitCols(line);
        const item = {};
        headers.forEach((h, i) => {
          item[h] = cols[i] ?? "";
        });
        item._row = idx + 2;
        return item;
      });
    }

    function extractKeyValue(row, category) {
      const cfg = CATEGORY_CONFIG[category] || { keys: ["id"] };
      const keys = Object.keys(row);
      for (const candidate of cfg.keys) {
        const found = keys.find(k => k.trim().toLowerCase() === candidate);
        if (found && String(row[found] ?? "").trim() !== "") {
          return String(row[found]).trim().toLowerCase();
        }
      }
      return String(row[keys[0]] ?? "").trim().toLowerCase();
    }

    async function checkDuplicates(sheetId, category, rows) {
      const cfg = CATEGORY_CONFIG[category];
      const existingSet = new Set();

      if (sheetId && cfg?.tab) {
        try {
          const existingRows = await fetchGvizRows(sheetId, cfg.tab);
          existingRows.forEach(r => {
            const k = extractKeyValue(r, category);
            if (k) existingSet.add(k);
          });
        } catch (_) {
          // Ignore if target tab does not exist yet
        }
      }

      const seenBatch = new Set();
      return rows.map(r => {
        const key = extractKeyValue(r, category);
        const dupSheet = Boolean(key && existingSet.has(key));
        const dupBatch = Boolean(key && seenBatch.has(key));
        if (key) seenBatch.add(key);

        let status = "New";
        if (dupSheet) status = "Duplicate (Sheet)";
        else if (dupBatch) status = "Duplicate (Batch)";

        return { ...r, _status: status };
      });
    }

    async function handlePreviewAndCheck() {
      hideAlert("bulkAlert");
      const sheetId = cleanSheetId(document.getElementById("sheetIdInput").value);
      const category = document.getElementById("categorySelect").value;

      try {
        const parsed = parseBulkRows(document.getElementById("bulkTextarea").value);
        const checked = await checkDuplicates(sheetId, category, parsed);
        lastBulkRows = checked;

        const dupCount = checked.filter(r => r._status !== "New").length;
        const newCount = checked.length - dupCount;

        renderTable("bulkTableWrap", checked, true);
        showAlert(
          "bulkAlert",
          dupCount > 0 ? "warn" : "success",
          `Total: ${checked.length} | New: ${newCount} | Duplicates: ${dupCount}`
        );
      } catch (err) {
        lastBulkRows = [];
        renderTable("bulkTableWrap", [], false);
        showAlert("bulkAlert", "error", err.message);
      }
    }

    async function handleBulkSubmit() {
      hideAlert("bulkAlert");
      const sheetId = cleanSheetId(document.getElementById("sheetIdInput").value);
      const scriptUrl = document.getElementById("scriptUrlInput").value.trim();
      const category = document.getElementById("categorySelect").value;
      const skipDups = document.getElementById("skipDupCheckbox").checked;

      if (!sheetId) {
        showAlert("bulkAlert", "error", t("errMissingSheet"));
        return;
      }
      if (!scriptUrl) {
        showAlert("bulkAlert", "error", t("errMissingScript"));
        return;
      }

      localStorage.setItem("smartsoft_sheet_id", sheetId);
      localStorage.setItem("smartsoft_script_url", scriptUrl);

      try {
        const parsed = parseBulkRows(document.getElementById("bulkTextarea").value);
        const checked = await checkDuplicates(sheetId, category, parsed);
        lastBulkRows = checked;
        renderTable("bulkTableWrap", checked, true);

        const toSend = skipDups ? checked.filter(r => r._status === "New") : checked;
        if (!toSend.length) {
          showAlert("bulkAlert", "warn", "No new records to send (all rows are duplicates).");
          return;
        }

        const cleanRows = toSend.map(({ _row, _status, ...rest }) => rest);

        await fetch(scriptUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sheetId,
            category,
            skipDuplicates: skipDups,
            rows: cleanRows
          })
        });

        const skipped = checked.length - toSend.length;
        showAlert(
          "bulkAlert",
          "success",
          `Sent ${cleanRows.length} ${category} record(s) to Google Sheet` +
          (skipped > 0 ? ` (${skipped} duplicate(s) skipped).` : ".")
        );
      } catch (err) {
        showAlert("bulkAlert", "error", err.message);
      }
    }

    function renderTable(wrapId, rows, showStatus) {
      const wrap = document.getElementById(wrapId);
      if (!rows || !rows.length) {
        wrap.style.display = "none";
        wrap.innerHTML = "";
        return;
      }

      const cols = Object.keys(rows[0]).filter(k => !k.startsWith("_"));
      let html = "<table><thead><tr>";
      if (showStatus) html += "<th>Status</th>";
      html += cols.map(c => `<th>${escapeHtml(c)}</th>`).join("") + "</tr></thead><tbody>";

      rows.forEach(r => {
        const isDup = r._status && r._status !== "New";
        html += `<tr class="${isDup ? "dup-row" : ""}">`;
        if (showStatus) {
          html += isDup
            ? `<td><span class="badge-dup">${escapeHtml(r._status)}</span></td>`
            : `<td><span class="badge-new">New</span></td>`;
        }
        html += cols.map(c => `<td>${escapeHtml(String(r[c] ?? ""))}</td>`).join("") + "</tr>";
      });

      html += "</tbody></table>";
      wrap.innerHTML = html;
      wrap.style.display = "block";
    }

    function exportTableCsv(rows, filename) {
      if (!rows || !rows.length) return;
      const cols = Object.keys(rows[0]).filter(k => !k.startsWith("_"));
      const escapeCsv = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const csvLines = [
        cols.map(escapeCsv).join(","),
        ...rows.map(r => cols.map(c => escapeCsv(r[c])).join(","))
      ];
      const blob = new Blob(["\uFEFF" + csvLines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
